<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Talon — пример рабочего процесса</title>
  <desc id="description">Условный запрос: починить экспорт CSV, в котором теряется кириллица. Четыре шага: воспроизведение, минимальная правка, проверка регрессий, diff и отчёт. Это анимированная схема процесса, а не запись выполнения задачи.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .phase { opacity: 0; animation: phase 16s linear infinite; }
    .phase-2 { animation-delay: 4s; }
    .phase-3 { animation-delay: 8s; }
    .phase-4 { animation-delay: 12s; }
    .progress { transform: scaleX(0); transform-box: fill-box; transform-origin: left center; animation: progress 16s linear infinite; }
    @keyframes phase {
      0%, 24.9% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes progress {
      0% { transform: scaleX(0); }
      98%, 100% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .phase, .progress { animation: none; }
      .phase { opacity: 1; }
      .progress { transform: scaleX(1); }
    }
  </style>

  <rect x="1" y="1" width="958" height="358" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M32 37h9l7-12 7 12h9l-16 20z" fill="#ff3b9d"/>
  <text x="78" y="49" fill="#f0f6fc" font-size="27" font-weight="750" letter-spacing="2">TALON</text>
  <rect x="628" y="25" width="302" height="34" rx="17" fill="#1b2030"/>
  <text x="779" y="47" fill="#b1bac4" font-size="16" text-anchor="middle">Пример рабочего процесса</text>

  <rect x="30" y="80" width="900" height="64" rx="11" fill="#161b22" stroke="#30363d"/>
  <path d="m48 103 7 7-7 7" fill="none" stroke="#ffe66d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="119" fill="#f0f6fc" font-size="21">
    <tspan fill="#ff3b9d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$talon:qa</tspan>
    <tspan dx="9">Почини экспорт CSV: теряется кириллица</tspan>
  </text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="174" width="210" height="108" rx="12"/>
    <rect x="260" y="174" width="210" height="108" rx="12"/>
    <rect x="490" y="174" width="210" height="108" rx="12"/>
    <rect x="720" y="174" width="210" height="108" rx="12"/>
  </g>

  <g class="phase phase-1" fill="none" stroke="#ff3b9d" stroke-width="2">
    <rect x="30" y="174" width="210" height="108" rx="12"/>
    <path d="M48 195h20" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="phase phase-2" fill="none" stroke="#ff3b9d" stroke-width="2">
    <rect x="260" y="174" width="210" height="108" rx="12"/>
    <path d="M278 195h20" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="phase phase-3" fill="none" stroke="#ffe66d" stroke-width="2">
    <rect x="490" y="174" width="210" height="108" rx="12"/>
    <path d="M508 195h20" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="phase phase-4" fill="none" stroke="#ffe66d" stroke-width="2">
    <rect x="720" y="174" width="210" height="108" rx="12"/>
    <path d="M738 195h20" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="#8b949e" font-size="13" font-weight="600">
    <text x="211" y="200" text-anchor="end">01</text>
    <text x="441" y="200" text-anchor="end">02</text>
    <text x="671" y="200" text-anchor="end">03</text>
    <text x="901" y="200" text-anchor="end">04</text>
  </g>
  <g fill="#f0f6fc" font-size="19" font-weight="650">
    <text x="48" y="236">Воспроизведение</text>
    <text x="278" y="236">Правка</text>
    <text x="508" y="236">Регрессии</text>
    <text x="738" y="236">Diff и отчёт</text>
  </g>
  <g fill="#9da7b3" font-size="14">
    <text x="48" y="261">Найти причину</text>
    <text x="278" y="261">Минимальное изменение</text>
    <text x="508" y="261">Повторить сценарий</text>
    <text x="738" y="261">Показать результат</text>
  </g>
  <g fill="none" stroke="#59636e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 226h8m-4-4 4 4-4 4"/>
    <path d="M476 226h8m-4-4 4 4-4 4"/>
    <path d="M706 226h8m-4-4 4 4-4 4"/>
  </g>

  <rect x="30" y="306" width="900" height="4" rx="2" fill="#21262d"/>
  <rect class="progress" x="30" y="306" width="900" height="4" rx="2" fill="#ff3b9d"/>
  <text x="30" y="337" fill="#8b949e" font-size="14">От запроса к проверяемому исправлению</text>
  <text x="930" y="337" text-anchor="end" fill="#8b949e" font-size="14">Codex + Talon</text>
</svg>

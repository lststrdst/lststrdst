name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?palette=github-light&color_snake=#ff3b9d&color_dots=#ebedf0,#ffc4e1,#ff8fc7,#ff5aaa,#ff3b9d
            profile/github-snake-dark.svg?palette=github-dark&color_snake=#ffe66d&color_dots=#161b22,#5b1b45,#9e286d,#d73d93,#ff3b9d

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake.svg profile/github-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push
